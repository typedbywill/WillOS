# ==============================================================================
# KITTY CONFIGURATION - CAELESTIA / HYPRLAND
# ==============================================================================

# --- Tipografia & Fontes ---
font_family      SFMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Aparência da Janela ---
window_padding_width 12 16
background_opacity   0.88
background_blur      1
hide_window_decorations yes
confirm_os_window_close 0

# --- Cursor & Mouse ---
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
mouse_hide_wait       3.0
url_style             curly
detect_urls           yes

# --- Som / Notificação ---
enable_audio_bell     no
visual_bell_duration  0

# --- Barra de Abas ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_font_style bold

# --- Shell Padrão ---
shell fish

# --- Paleta de Cores (Caelestia / Catppuccin) ---
foreground            #e5e1e7
background            #131317
selection_foreground  #131317
selection_background  #c2c1ff

cursor                #c2c1ff
cursor_text_color     #131317

url_color             #7382d2
active_border_color   #c2c1ff
inactive_border_color #47464f

# Cores Normais
color0  #353434
color1  #ac73ff
color2  #44def5
color3  #ffdcf2
color4  #99aad8
color5  #b49fea
color6  #9dceff
color7  #e8d3de

# Cores Brilhantes
color8  #ac9fa9
color9  #c093ff
color10 #89ecff
color11 #fff0f6
color12 #b5c1dd
color13 #c9b5f4
color14 #bae0ff
color15 #ffffff
