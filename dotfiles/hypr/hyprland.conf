# Acer ED270R (DP-1): 1080p na maior taxa anunciada pelo painel (165 Hz).
monitor = DP-1,1920x1080@165,auto,1
# Fallback automático para outros monitores
monitor = ,1920x1080@60,auto,1

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = BROWSER,firefox

exec-once = hyprctl setcursor Bibata-Modern-Classic 24

input {
    kb_layout = br
    numlock_by_default = true
    follow_mouse = 1
    # Perfil plano: sem aceleração do ponteiro.
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

# Desabilitar cursores de hardware resolve piscadas e desaparecimento na GPU Nvidia.
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    inactive_timeout = 0
}

# Importa as cores dinâmicas geradas pelo Caelestia
source = ~/.config/hypr/scheme/current.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($primaryee)
    col.inactive_border = rgba($outlineVariant66)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
}

# Importa variáveis de ambiente para systemd e D-Bus
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# A barra, notificações e launcher do Caelestia começam com a sessão.
exec-once = caelestia shell -d
# Gerenciamento automático de monitor virtual ao desconectar monitor físico
exec-once = ~/.config/hypr/scripts/auto-virtual-display.sh

$mainMod = SUPER
$browser = firefox
$filemanager = dolphin

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Escape, exec, missioncenter
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, M, togglespecialworkspace, music
bind = $mainMod, W, togglespecialworkspace, communication
bind = $mainMod, Q, killactive
bind = $mainMod ALT, M, exit
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT, F, fullscreen, 0
bind = $mainMod, T, togglefloating
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CONTROL, left, resizeactive, -30 0
binde = $mainMod CONTROL, right, resizeactive, 30 0
binde = $mainMod CONTROL, up, resizeactive, 0 -30
binde = $mainMod CONTROL, down, resizeactive, 0 30

# Mover/redimensionar com o mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, Space, exec, caelestia shell drawers toggle launcher
bind = $mainMod, N, exec, caelestia shell drawers toggle sidebar
bind = $mainMod, G, exec, caelestia shell gameMode toggle
bind = $mainMod SHIFT, V, exec, caelestia shell drawers toggle clipboard
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, caelestia screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Controle de áudio e multimídia (Knob de Volume / Teclas de Mídia)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

# Controle de brilho (Caelestia)
bindel = , XF86MonBrightnessUp, exec, caelestia shell brightness set +5%
bindel = , XF86MonBrightnessDown, exec, caelestia shell brightness set 5%-

# Zoom do desktop / Lupa de tela (Hyprland)
binde = $mainMod, equal, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {printf "%.2f", ($2 >= 3.0 ? 3.0 : $2 + 0.2)}')
binde = $mainMod, minus, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {printf "%.2f", ($2 <= 1.0 ? 1.0 : $2 - 0.2)}')
bind  = $mainMod, 0, exec, hyprctl keyword cursor:zoom_factor 1.0

# Regras de Janelas para Workspaces Especiais
windowrule = workspace special:music silent, match:class ^(Spotify|spotify)$
windowrule = workspace special:communication silent, match:class ^(zapzap|com\.rtosta\.zapzap)$
windowrule = workspace special:communication silent, match:class ^(org\.telegram\.desktop|telegramdesktop)$
windowrule = workspace special:communication silent, match:class ^(discord|vesktop|WebCord)$

# Regras visuais e de comportamento para o Dolphin e utilitários KDE
windowrule = opacity 0.94 0.88, match:class ^(org\.kde\.dolphin|dolphin)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Propriedades.*|.*Properties.*)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Progresso.*|.*Progress.*)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Copiando.*|.*Copying.*|.*Movendo.*|.*Moving.*)$
windowrule = float 1, match:class ^(org\.kde\.kdialog)$