# Monitores
monitor = DP-1,1920x1080@75,0x0,1
monitor = HDMI-A-1,1920x1080@75,1920x0,1
monitor = eDP-1,1920x1080@60,3840x0,1
# Fallback automático para outros monitores
monitor = ,preferred,auto,1

# Atribuição de Workspaces aos Monitores
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

workspace = 11, monitor:eDP-1, default:true
workspace = 12, monitor:eDP-1
workspace = 13, monitor:eDP-1
workspace = 14, monitor:eDP-1
workspace = 15, monitor:eDP-1

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = BROWSER,firefox

exec-once = hyprctl setcursor Bibata-Modern-Classic 24

input {
    kb_layout = br
    numlock_by_default = true
    follow_mouse = 1
    # Perfil plano: sem aceleração do ponteiro.
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

# Desabilitar cursores de hardware resolve piscadas e desaparecimento na GPU Nvidia.
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    inactive_timeout = 0
}

binds {
    pass_mouse_when_bound = false
    scroll_event_delay = 0
}

# Cores padrão / fallback caso o tema dinâmico ainda não tenha sido gerado
$primary = c2c1ff
$outlineVariant = 47464f

# Importa as cores dinâmicas geradas pelo Caelestia
source = ~/.config/hypr/scheme/current.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($primaryee)
    col.inactive_border = rgba($outlineVariant66)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
}

# Importa variáveis de ambiente para systemd e D-Bus
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Aplica wallpaper padrão se ainda não houver nenhum configurado
exec-once = [ -d "$HOME/.cache/caelestia/wallpapers" ] || ([ -f "$HOME/Pictures/Wallpapers/default.jpg" ] && uwsm app -s b -- caelestia wallpaper -f "$HOME/Pictures/Wallpapers/default.jpg")

# A barra, notificações e launcher do Caelestia começam com a sessão.
exec-once = uwsm app -s b -- caelestia shell -d
# Gerenciamento automático de monitor virtual ao desconectar monitor físico
exec-once = uwsm app -s b -- ~/.config/hypr/scripts/auto-virtual-display.sh
# Inicia o KeePassXC com a sessão em segundo plano
exec-once = uwsm app -s b -- keepassxc
# Histórico de área de transferência (cliphist)
exec-once = uwsm app -s b -- wl-paste --watch cliphist store
exec-once = uwsm app -s b -- wl-paste --type image --watch cliphist store

$mainMod = SUPER
$browser = uwsm app -- firefox
$filemanager = uwsm app -- dolphin
$terminal = uwsm app -- kitty
$taskmanager = uwsm app -- missioncenter

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Escape, exec, $taskmanager
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $filemanager
bind = $mainMod, L, exec, caelestia shell lock lock
bind = $mainMod, M, exec, ~/.config/hypr/scripts/toggle-special.sh music 'Spotify|spotify' 'spotify'
bind = $mainMod, W, exec, ~/.config/hypr/scripts/toggle-special.sh communication 'com\.rtosta\.zapzap|zapzap' 'zapzap'
bind = $mainMod, K, exec, ~/.config/hypr/scripts/toggle-special.sh passwords 'org\.keepassxc\.KeePassXC|keepassxc' 'keepassxc'
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT, F, fullscreen, 0
bind = $mainMod, T, togglefloating
bind = $mainMod, P, pin
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod SHIFT, Return, swapnext
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CONTROL, left, resizeactive, -30 0
binde = $mainMod CONTROL, right, resizeactive, 30 0
binde = $mainMod CONTROL, up, resizeactive, 0 -30
binde = $mainMod CONTROL, down, resizeactive, 0 30

# Mover/redimensionar com o mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Navegação e movimentação de workspaces com o Scroll do Mouse
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1
bind = $mainMod SHIFT, mouse_down, movetoworkspace, m+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, m-1
# Painéis e Gavetas do Caelestia
bind = $mainMod, Space, exec, caelestia shell drawers toggle launcher
bind = $mainMod, N, exec, caelestia shell drawers toggle sidebar
bind = $mainMod, D, exec, caelestia shell drawers toggle dashboard
bind = $mainMod, U, exec, caelestia shell drawers toggle utilities
bind = $mainMod, V, exec, caelestia clipboard
bind = $mainMod SHIFT, V, exec, caelestia clipboard -d
bind = $mainMod, X, exec, caelestia shell drawers toggle session
bind = $mainMod ALT, Escape, exec, caelestia shell drawers toggle session
bind = $mainMod, G, exec, caelestia shell gameMode toggle

# Utilitários e Ferramentas Rápidas
bind = $mainMod, period, exec, caelestia emoji -p
bind = $mainMod SHIFT, C, exec, caelestia picker open
bind = $mainMod SHIFT, R, exec, caelestia record -r -c
bind = $mainMod ALT, C, exec, caelestia shell idleInhibitor toggle
bind = $mainMod SHIFT, D, exec, caelestia shell notifs toggleDnd
bind = $mainMod ALT, W, exec, caelestia wallpaper -r

# Capturas de Tela
bind = , Print, exec, uwsm app -- sh -c 'grim -g "$(slurp)" - | swappy -f -'
bind = SHIFT, Print, exec, uwsm app -- caelestia screenshot
bind = $mainMod SHIFT, S, exec, uwsm app -- sh -c 'grim -g "$(slurp)" - | swappy -f -'
# Navegação e movimentação de workspaces independentes por monitor (1..5 na tela focada)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace.sh switch 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace.sh switch 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace.sh switch 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace.sh switch 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace.sh switch 5
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/workspace.sh move 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/workspace.sh move 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/workspace.sh move 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/workspace.sh move 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/workspace.sh move 5

# Controle de áudio e multimídia (Knob de Volume / Teclas de Mídia)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindl  = , XF86AudioStop, exec, playerctl stop

# Atalhos rápidos de Áudio (Volume, Mute, Play/Pause e Troca de Dispositivos)
bind  = $mainMod ALT, mouse_up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind  = $mainMod ALT, mouse_down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = $mainMod ALT, up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = $mainMod ALT, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = $mainMod ALT, right, exec, playerctl next
bindl = $mainMod ALT, left, exec, playerctl previous
bindl = $mainMod ALT, Backspace, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = $mainMod ALT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = $mainMod ALT, P, exec, playerctl play-pause
bind  = $mainMod ALT, O, exec, caelestia shell audio cycleOutput
bind  = $mainMod ALT, I, exec, ~/.config/hypr/scripts/cycle-audio-source.sh

# Controle de brilho (Caelestia)
bindel = , XF86MonBrightnessUp, exec, caelestia shell brightness set +5%
bindel = , XF86MonBrightnessDown, exec, caelestia shell brightness set 5%-

# Zoom do desktop / Lupa de tela (Hyprland)
binde = $mainMod, equal, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {printf "%.2f", ($2 >= 3.0 ? 3.0 : $2 + 0.2)}')
binde = $mainMod, minus, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {printf "%.2f", ($2 <= 1.0 ? 1.0 : $2 - 0.2)}')
bind  = $mainMod, 0, exec, hyprctl keyword cursor:zoom_factor 1.0

# Regras de Janelas para Workspaces Especiais
windowrule = workspace special:music silent, match:class ^(Spotify|spotify)$
windowrule = workspace special:communication silent, match:class ^(zapzap|com\.rtosta\.zapzap)$
windowrule = workspace special:communication silent, match:class ^(org\.telegram\.desktop|telegramdesktop)$
windowrule = workspace special:communication silent, match:class ^(discord|vesktop|WebCord)$
windowrule = workspace special:passwords silent, match:class ^(org\.keepassxc\.KeePassXC|keepassxc)$

# Regras visuais e de comportamento para o Dolphin e utilitários KDE
windowrule = opacity 0.94 0.88, match:class ^(org\.kde\.dolphin|dolphin)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Propriedades.*|.*Properties.*)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Progresso.*|.*Progress.*)$
windowrule = float 1, match:class ^(org\.kde\.dolphin)$, match:title ^(.*Copiando.*|.*Copying.*|.*Movendo.*|.*Moving.*)$
windowrule = float 1, match:class ^(org\.kde\.kdialog)$