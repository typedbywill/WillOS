# Configuração inicial. Hyprland recarrega este arquivo automaticamente.
# Acer ED270R (DP-1): 1080p na maior taxa anunciada pelo painel (165 Hz).
monitor = DP-1,1920x1080@165,auto,1

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1

exec-once = hyprctl setcursor Bibata-Modern-Classic 24

input {
    kb_layout = br
    follow_mouse = 1
    # Perfil plano: sem aceleração do ponteiro.
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

# Desabilitar cursores de hardware resolve piscadas e desaparecimento na GPU Nvidia.
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
    inactive_timeout = 0
}

# Importa as cores dinâmicas geradas pelo Caelestia
source = ~/.config/hypr/scheme/current.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($primaryee)
    col.inactive_border = rgba($outlineVariant66)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
}

# A barra, notificações e launcher do Caelestia começam com a sessão.
exec-once = caelestia shell -d

$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, exec, caelestia shell drawers toggle launcher
bind = $mainMod SHIFT, V, exec, caelestia shell drawers toggle clipboard
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
