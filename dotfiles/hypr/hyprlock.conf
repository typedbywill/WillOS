# Fallback de cores caso o tema dinâmico do Caelestia ainda não tenha sido gerado
$background = 131317
$onBackground = e5e1e7
$surface = 131317
$surfaceContainer = 201f23
$outline = 918f9a
$outlineVariant = 47464f
$primary = c2c1ff
$error = ffb4ab

# Importa as cores dinâmicas geradas pelo Caelestia
source = ~/.config/hypr/scheme/current.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Relógio (Hora)
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba($onBackgroundff)
    font_size = 90
    font_family = SF Pro Display Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Data
label {
    monitor =
    text = cmd[update:1000] LC_TIME=@WILLOS_LOCALE@ date +"%A, %d de %B"
    color = rgba($onBackgroundcc)
    font_size = 22
    font_family = SF Pro Display
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Campo de senha
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba($primaryee)
    inner_color = rgba($surfaceContainercc)
    font_color = rgba($onBackgroundff)
    fade_on_empty = false
    placeholder_text = <span foreground="##$outline">Digite a senha...</span>
    hide_input = false
    rounding = 25
    check_color = rgba($primaryee)
    fail_color = rgba($errorff)
    fail_text = <i>Senha incorreta! <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}
